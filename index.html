<!DOCTYPE html>
<html>
<head>
  <title>High-Low Game (Localhost)</title>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.10.0/dist/ethers.umd.min.js"></script>

  <h2>🎴 Provably Fair High–Low Game</h2>

  <button onclick="connectWallet()">Connect Wallet</button>
  <p id="wallet"></p>

  <hr>

  <p>Current Card: <span id="currentCard">-</span></p>

  <button onclick="guess(true)">Guess Higher</button>
  <button onclick="guess(false)">Guess Lower</button>

  <hr>

  <h3>Result</h3>
  <p id="result"></p>

  <h3>Fairness Verification</h3>
  <p id="fairness"></p>

<script>
let provider;
let signer;
let contract;
let roundId;
let seed;
let commitment;

const contractAddress = "0x5FbDB2315678afecb367f032d93F642f64180aa3"; // Update with latest deployed address

const abi = [
  "function createRound(address player, uint8 currentCard, bytes32 commitment) returns (uint256)",
  "function submitGuess(uint256 roundId, bool guessHigher)",
  "function revealSeed(uint256 roundId, uint256 seed)",
  "function getRound(uint256 roundId) view returns (address,uint8,bool,bool,bool,bool,bytes32,uint256,uint8,uint8)",
  "function nextRoundId() view returns (uint256)"
];

function deriveNextCardLikeContract(currentCard, hashHex) {
  const computed = BigInt(hashHex);
  const roll = computed % 51n;

  if (roll < 3n) return currentCard; // push / tie

  const idx = (roll - 3n) / 4n; // 0..11
  const v = BigInt(currentCard);

  if (idx < (v - 1n)) return Number(idx + 1n);
  return Number(idx + 2n);
}

async function ensureHardhatNetwork() {
  const hardhatChainIdHex = "0x7a69"; // 31337

  try {
    await window.ethereum.request({
      method: "wallet_switchEthereumChain",
      params: [{ chainId: hardhatChainIdHex }],
    });
  } catch (switchError) {
    if (switchError.code === 4902) {
      await window.ethereum.request({
        method: "wallet_addEthereumChain",
        params: [{
          chainId: hardhatChainIdHex,
          chainName: "Hardhat Local",
          rpcUrls: ["http://127.0.0.1:8545"],
          nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 },
        }],
      });
    } else {
      throw switchError;
    }
  }
}

async function connectWallet() {
  if (!window.ethereum) {
    alert("MetaMask not found. Install it first.");
    return;
  }

  await ensureHardhatNetwork();

  provider = new ethers.BrowserProvider(window.ethereum);

  const network = await provider.getNetwork();
  console.log("chainId:", network.chainId.toString());

  if (network.chainId !== 31337n) {
    alert("You are NOT on Hardhat Local (31337). Switch MetaMask network and retry.");
    return;
  }

  await provider.send("eth_requestAccounts", []);
  signer = await provider.getSigner();

  contract = new ethers.Contract(contractAddress, abi, signer);

  document.getElementById("wallet").innerText =
    "Connected: " + await signer.getAddress();

  await startRound();
}

async function startRound() {
  const currentCard = Math.floor(Math.random() * 13) + 1;
  document.getElementById("currentCard").innerText = currentCard;
  document.getElementById("result").innerText = "";
  document.getElementById("fairness").innerText = "";

  seed = BigInt(
    "0x" +
    crypto.getRandomValues(new Uint8Array(32))
      .reduce((str, byte) => str + byte.toString(16).padStart(2, "0"), "")
  );

  commitment = ethers.keccak256(
    ethers.AbiCoder.defaultAbiCoder().encode(["uint256"], [seed])
  );

  const tx = await contract.createRound(
    await signer.getAddress(),
    currentCard,
    commitment
  );
  await tx.wait();

  roundId = (await contract.nextRoundId()) - 1n;
  console.log("Started round:", roundId.toString());
}

async function guess(isHigher) {
  if (roundId === undefined) {
    alert("Connect wallet and start a round first.");
    return;
  }

  const guessTx = await contract.submitGuess(roundId, isHigher);
  await guessTx.wait();

  const revealTx = await contract.revealSeed(roundId, seed);
  await revealTx.wait();

  const round = await contract.getRound(roundId);

  const currentCard = Number(round[1]);
  const playerWon = round[4];
  const push = round[5];
  const commitmentOnChain = round[6];
  const seedOnChain = round[7];
  const nextCard = Number(round[8]);

  document.getElementById("result").innerText =
    "Next Card: " + nextCard + " → " +
    (push ? "🤝 PUSH" : playerWon ? "🎉 YOU WON" : "💀 YOU LOST");

  const recomputed = ethers.keccak256(
    ethers.AbiCoder.defaultAbiCoder().encode(["uint256"], [seedOnChain])
  );

  const nextCardLocal = deriveNextCardLikeContract(currentCard, recomputed);

  document.getElementById("fairness").innerText =
    "Commitment match: " + (recomputed === commitmentOnChain) +
    " | Card match: " + (nextCardLocal === nextCard);

  await startRound();
}
</script>

</body>
</html>
